# AlpenData AgentBox tenant template.
# Replace every <angle-bracket> value before rendering. Do not leave placeholders
# in a live manifest. The image field is supplied by the AgentBox build pipeline;
# this file does not publish a container image.
apiVersion: agentbox.alpendata.ch/v1
kind: Tenant
metadata:
  id: <tenant-id>
  displayName: <company-name>
spec:
  image: <agentbox-image>
  hostRoot: /var/lib/agentbox/<tenant-id>
  publicOrigin: https://<customer-assistant-host>
  gatewayPort: 18789
  timezone: Europe/Zurich
  identity:
    mode: trusted-proxy
    trustedProxies:
      - <idp-proxy-address>
    userHeader: x-forwarded-user
    requiredHeaders:
      - x-forwarded-proto
    allowUsers: []
  provider:
    model: openai/gpt-5.5
    apiKeyEnv: OPENAI_API_KEY
  # The plan the customer bought. Quotas are enforced by the tenant runtime, so a
  # tier change is a manifest change plus `openclaw config set --batch-file`.
  # See docs/agentbox/pricing.md. Seat counts are contractual and are not listed
  # here because AgentBox cannot enforce them.
  subscription:
    planId: <plan-id>
    status: active
    quotas:
      maxSources: 3
      maxDocuments: 25000
      maxStorageBytes: 53687091200
      minSyncIntervalMinutes: 15
  documents:
    backend:
      baseUrl: https://<ragflow-host>
      datasetId: <tenant-id>-internal
      apiKeyEnv: AGENTBOX_RAGFLOW_API_KEY
      allowPrivateNetwork: false
    sources:
      - id: microsoft-365
        type: microsoft-365
        driveId: <sharepoint-or-onedrive-drive-id>
        entraTenantIdEnv: AGENTBOX_MS_TENANT_ID
        clientIdEnv: AGENTBOX_MS_CLIENT_ID
        clientSecretEnv: AGENTBOX_MS_CLIENT_SECRET
      - id: google-drive
        type: google-drive
        driveId: <shared-drive-id>
        clientIdEnv: AGENTBOX_GOOGLE_CLIENT_ID
        clientSecretEnv: AGENTBOX_GOOGLE_CLIENT_SECRET
        refreshTokenEnv: AGENTBOX_GOOGLE_REFRESH_TOKEN
      - id: kdrive
        type: webdav
        baseUrl: https://<id>.connect.kdrive.infomaniak.com
        rootPath: /remote.php/dav/files/<account>
        usernameEnv: AGENTBOX_KDRIVE_USERNAME
        passwordEnv: AGENTBOX_KDRIVE_PASSWORD
  backup:
    retentionDays: 30
