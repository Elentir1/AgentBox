apiVersion: agentbox.alpendata.ch/v1
kind: Tenant
metadata:
  id: acme
  displayName: Acme SA
spec:
  image: ghcr.io/alpendata/agentbox:2026.8
  hostRoot: /var/lib/agentbox/acme
  publicOrigin: https://assistant.acme.example
  gatewayPort: 18789
  timezone: Europe/Zurich
  identity:
    mode: trusted-proxy
    trustedProxies:
      - 172.20.0.10
    userHeader: x-forwarded-user
    requiredHeaders:
      - x-forwarded-proto
    allowUsers:
      - admin@acme.example
  provider:
    model: openai/gpt-5.5
    apiKeyEnv: OPENAI_API_KEY
  documents:
    backend:
      baseUrl: http://ragflow.internal:9380
      datasetId: acme-internal
      apiKeyEnv: AGENTBOX_RAGFLOW_API_KEY
      allowPrivateNetwork: true
    sources:
      - id: finance-sharepoint
        type: microsoft-365
        driveId: example-drive-id
        accessTokenEnv: AGENTBOX_MICROSOFT_ACCESS_TOKEN
      - id: shared-drive
        type: google-drive
        driveId: example-shared-drive-id
        accessTokenEnv: AGENTBOX_GOOGLE_ACCESS_TOKEN
      - id: kdrive
        type: webdav
        baseUrl: https://example.connect.kdrive.infomaniak.com
        rootPath: /remote.php/dav/files/example
        usernameEnv: AGENTBOX_WEBDAV_USERNAME
        passwordEnv: AGENTBOX_WEBDAV_PASSWORD
      - id: network-pdfs
        type: local
        root: /srv/acme/documents
  backup:
    retentionDays: 30
